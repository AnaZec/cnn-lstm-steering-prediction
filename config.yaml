dataset:
  driving_log_csv: "data/udacity/driving_log.csv"
  image_root: "data/udacity/IMG"
  has_header: false
  csv_columns:
    - "centercam"
    - "leftcam"
    - "rightcam"
    - "steering_angle"
    - "throttle"
    - "reverse"
    - "speed"
  center_camera_column: "centercam"
  steering_column: "steering_angle"

preprocessing:
  image_width: 160
  image_height: 80
  channels: 3
  normalize: true

sequences:
  sequence_length: 5
  stride: 1

split:
  validation_ratio: 0.2
  random_seed: 42

training:
  batch_size: 32
  epochs: 10
  learning_rate: 0.001

model:
  lstm_units: 64
  dense_units: 32
  dropout_rate: 0.2

lane_change:
  steering_threshold: 0.15
  smoothing_window: 5
  min_duration_frames: 5

outputs:
  checkpoint_path: "outputs/models/best_model.keras"
  final_model_path: "outputs/models/final_model.keras"
  history_path: "outputs/models/training_history.json"
  evaluation_metrics_path: "outputs/evaluation/evaluation_metrics.json"
  prediction_plot_path: "outputs/plots/predicted_vs_true_steering.png"
  loss_plot_path: "outputs/plots/training_validation_loss.png"
  inference_predictions_path: "outputs/inference/steering_predictions.csv"
  demo_frames_dir: "outputs/demo/annotated_frames"
